name: Tauri

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --dir apps/desktop run test:renderer
      - run: pnpm --dir apps/desktop run test:updater

  rust-contracts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Test Tauri backend
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Lint Tauri backend
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test Rig feasibility spike
        run: cargo test --manifest-path apps/desktop/rig-spike/Cargo.toml

  package:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/shared-ipc run build
      - run: pnpm --dir packages/emulator-protocol run build
      - name: Build signed Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: pnpm --dir apps/desktop run package:tauri:${{ matrix.os == 'macos-14' && 'mac' || 'win' }}
      - uses: actions/upload-artifact@v4
        with:
          name: dartsnut-tauri-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*
