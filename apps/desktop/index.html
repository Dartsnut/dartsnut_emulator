<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dartsnut Agent</title>
    <script>
      (function () {
        function setTheme(value) {
          document.documentElement.dataset.theme = value;
          document.documentElement.classList.toggle("dark", value === "dark");
        }
        var key = "dartsnut-theme";
        try {
          var stored = localStorage.getItem(key);
          if (stored === "dart") {
            try {
              localStorage.setItem(key, "dark");
            } catch (e2) {}
            setTheme("dark");
            return;
          }
          if (stored === "dark" || stored === "light") {
            setTheme(stored);
            return;
          }
        } catch (e) {}
        try {
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
            setTheme("light");
            return;
          }
        } catch (e) {}
        setTheme("dark");
      })();
      (function () {
        var root;
        function summarize(value) {
          var text = value instanceof Error ? value.message : String(value || "Unknown startup error");
          if (!text) text = "Renderer startup error";
          return text.replace(/Bearer\s+[^\s,;]+/gi, "Bearer [REDACTED]").slice(0, 500);
        }
        function showError(value) {
          var message = summarize(value);
          if (window.__dartsnutStartupError) return;
          window.__dartsnutStartupError = message;
          root = root || document.getElementById("root");
          if (!root) return;
          root.innerHTML = '<div style="box-sizing:border-box;min-height:100%;max-height:100vh;overflow-y:auto;padding:24px;font:14px system-ui,sans-serif;color:#e7e1dc;background:#211b18"><div style="max-width:560px;margin:8vh auto;padding:32px;color:#e7e1dc;background:#211b18;border:1px solid #66483d;border-radius:12px"><h1 style="margin:0 0 12px;font-size:22px">Dartsnut Agent could not start</h1><p style="line-height:1.5;overflow-wrap:anywhere">' + message.replace(/[&<>\"]/g, function (c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"})[c]; }) + '</p><button style="padding:9px 14px;border-radius:7px;border:1px solid #9d7869;background:#332621;color:#fff;cursor:pointer" onclick="location.reload()">Reload</button></div></div>';
        }
        function isRendererScript(target) {
          var src = target && (target.src || target.getAttribute("src") || "");
          return /\/renderer\/main\.tsx(?:$|[?#])/.test(src) || /\/assets\/index-[^/]+\.js(?:$|[?#])/.test(src);
        }
        window.addEventListener("error", function (event) {
          if (event.error || event.message) showError(event.error || event.message);
          else if (event.target && event.target.tagName === "SCRIPT" && isRendererScript(event.target)) {
            var script = event.target;
            showError("Could not load renderer bundle: " + (script.src || script.getAttribute("src") || "unknown script"));
          }
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          if (event.reason) showError(event.reason);
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"><div style="font:14px system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:32px;color:#e7e1dc;background:#211b18;border:1px solid #4e3932;border-radius:12px"><h1 style="margin:0 0 12px;font-size:22px">Starting Dartsnut Agent…</h1><p style="line-height:1.5">Loading workspace and desktop services.</p></div></div>
    <script type="module" src="/renderer/main.tsx"></script>
  </body>
</html>
